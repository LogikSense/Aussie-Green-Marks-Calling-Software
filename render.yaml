services:
  # Backend API Service
  - type: web
    name: crm-verification-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_KEYS
        generateValue: true
        sync: false
    healthCheckPath: /api/v1/health

  # Frontend Web Service
  - type: web
    name: crm-verification-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Set this to your backend URL after deployment
        # Example: https://crm-verification-backend.onrender.com
        value: https://crm-verification-backend.onrender.com

